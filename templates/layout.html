<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NutriMatch • Smarte Mahlzeiten & Supermarkt-Angebote{% endblock %}</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#1B4332',
              light: '#2D6A4F',
              accent: '#40916C',
              soft: '#E8F5E9',
              dark: '#081C15'
            },
            canvas: '#FBFBFA',
            surface: '#FFFFFF',
            ink: {
              DEFAULT: '#18181B',
              muted: '#71717A',
              light: '#A1A1AA'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #FBFBFA;
      color: #18181B;
    }
    .tap-target {
      min-height: 44px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full flex flex-col font-sans antialiased text-ink">

  <!-- MINIMALIST EDITORIAL HEADER -->
  <header class="bg-surface/90 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-2.5 group">
        <span class="w-8 h-8 rounded-full bg-brand text-white flex items-center justify-center text-sm font-bold shadow-xs">
          <i data-lucide="sparkle" class="w-4 h-4"></i>
        </span>
        <span class="font-extrabold text-lg tracking-tight text-ink group-hover:text-brand transition-colors">
          Nutri<span class="text-brand">Match</span>
        </span>
      </a>

      <!-- Clean Navigation -->
      <nav class="flex items-center gap-1 sm:gap-2 text-sm font-medium">
        <a href="/plan" class="px-3.5 py-1.5 rounded-full transition-colors {{ 'bg-stone-100 text-brand font-semibold' if active_page == 'plan' else 'text-ink-muted hover:text-ink hover:bg-stone-50' }}">
          Wochenplan
        </a>
        <a href="/einkaufszettel" class="px-3.5 py-1.5 rounded-full transition-colors {{ 'bg-stone-100 text-brand font-semibold' if active_page == 'einkaufszettel' else 'text-ink-muted hover:text-ink hover:bg-stone-50' }}">
          Einkaufszettel
        </a>
        <a href="/" class="ml-2 px-4 py-1.5 rounded-full border border-stone-300 hover:border-brand text-ink hover:text-brand transition-all text-xs font-semibold flex items-center gap-1.5">
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
          <span>Neuer Plan</span>
        </a>
      </nav>

    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12">
    {% block content %}{% endblock %}
  </main>

  <!-- MINIMALIST FOOTER -->
  <footer class="border-t border-stone-200/80 py-8 text-center text-xs text-ink-muted">
    <div class="max-w-5xl mx-auto px-4 space-y-2">
      <p class="font-semibold text-ink">NutriMatch Deutschland</p>
      <p>Smarter Wocheneinkauf nach Prospekt-Angeboten & Zero Food Waste.</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
